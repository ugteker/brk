# Maydoz production stack — single Hetzner VPS, single all-in-one
# container (API + nginx), fronted by Cloudflare in "Full (strict)" proxy
# mode against the www.maydoz.com A record (see deploy/README.md).
#
# Secrets: loaded from `.env` at the repo root on the server (git-ignored,
# mode 600 — see apps/api/.env.example for the template of required keys).
# Nothing sensitive is baked into the image or written into this file.

services:
  maydoz:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BUILD_TIMESTAMP: ${VITE_BUILD_TIMESTAMP:-}
        VITE_BUILD_COMMIT_SHA: ${VITE_BUILD_COMMIT_SHA:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/api/prisma/dev.db"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - api-data:/app/api/prisma
      # Server-side secrets materialized by CI (not stored in git); mounted read-only
      # so GOOGLE_TTS_CREDENTIALS can point at /run/secrets/google-tts-service-account.json,
      # and nginx's 443 server block can load the Cloudflare Origin Certificate at
      # /run/secrets/cloudflare-origin.{pem,key} — see deploy/nginx.conf.
      - ./secrets:/run/secrets:ro
    # 80 redirects to 443 (see deploy/nginx.conf); 443 terminates TLS with the
    # Cloudflare Origin Certificate for Cloudflare's "Full (strict)" mode.
    ports:
      - "80:80"
      - "443:443"

volumes:
  api-data:
